name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One build per supported LeviLamina line (the lip variant of the same name; tools/build.ps1
        # knows its LeviLamina version and lock file) and per side.
        variant: ["26_60", "26_51"]
        target_type: [server, client]
    name: build (${{ matrix.target_type }}, LeviLamina ${{ matrix.variant }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.variant }}-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'locks/*.lock') }}
          restore-keys: |
            xmake-${{ matrix.variant }}-${{ matrix.target_type }}-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - run: xmake repo -u

      - name: Build
        shell: pwsh
        run: pwsh tools/build.ps1 -Target ${{ matrix.target_type }} -Line ${{ matrix.variant }}

      - name: Dump xmake package install logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/.xmake/cache/packages" -Recurse -Filter install.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "::group::$($_.FullName)"; Get-Content $_.FullName -Tail 400; Write-Host '::endgroup::' }

      - name: Unit tests
        if: matrix.target_type == 'server'
        run: |
          xmake build -y abp-tests
          xmake run abp-tests

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-win-x64-ll${{ matrix.variant }}
          path: |
            bin/${{ matrix.target_type }}/AlleviatedBackpacks/
